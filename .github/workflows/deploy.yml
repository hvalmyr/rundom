name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Coverage data from the latest data release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p public/data
          if gh release download --pattern data.tar.gz --dir "$RUNNER_TEMP"; then
            tar xzf "$RUNNER_TEMP/data.tar.gz" -C public/data
          else
            echo "::warning::Нет релиза с данными: сайт соберётся без покрытия улиц"
          fi
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
